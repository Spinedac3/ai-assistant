name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: assistant_test
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Solr needs the versioned configset from the checkout, so it starts here and not as a service
      - run: docker compose --profile engines up -d solr minio demo-db demo-mysql demo-mssql
      - run: |
          for i in $(seq 1 60); do
            curl -sf "http://localhost:8983/solr/docs/admin/ping" > /dev/null && break
            sleep 2
          done
      # The demo engines take a while to accept logins; the seed retries until each one answers
      - run: |
          seeded=0
          for i in $(seq 1 30); do
            pnpm demo:seed 2>&1 | tee seed.log
            if [ "$(grep -c ": clientes" seed.log)" = "3" ]; then seeded=1; break; fi
            sleep 5
          done
          [ "$seeded" = "1" ]
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://assistant:assistant@localhost:5432/assistant_test
