name: ai-assistant

# Ports bind to this machine only: Solr and MinIO have no login of their own here
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assistant}"]
      interval: 5s
      retries: 10

  solr:
    image: solr:9
    # Current versions in docs, superseded ones in docs_historical; both with the versioned schema
    command: >
      bash -c "precreate-core docs /var/solr/data/configsets/docs &&
      precreate-core docs_historical /var/solr/data/configsets/docs &&
      exec solr-foreground"
    ports:
      - "127.0.0.1:8983:8983"
    volumes:
      - solr-data:/var/solr
      - ./docker/solr/docs:/var/solr/data/configsets/docs:ro

  embed:
    build: ./docker/embed
    ports:
      - "127.0.0.1:5000:5000"

  minio:
    # MinIO stopped publishing community images; this one is built from the same source
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-assistant}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-assistant-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # Read-only source with invented data, used by the tool builder tests and the demo
  demo-db:
    image: postgres:17
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - demo-data:/var/lib/postgresql/data

  # The same demo data on the other two engines the tool builder supports; heavier, so they start
  # only with: docker compose --profile engines up -d
  demo-mysql:
    image: mysql:8.4
    profiles: [engines]
    environment:
      MYSQL_ROOT_PASSWORD: demo-root
      MYSQL_DATABASE: demo
    ports:
      - "127.0.0.1:3307:3306"

  demo-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [engines]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Demo-Root-2026
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1434:1433"

volumes:
  postgres-data:
  solr-data:
  minio-data:
  demo-data:
